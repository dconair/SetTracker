name: Installer bauen

# Baut die Installer für macOS und Windows. Start von Hand (Actions → "Installer bauen" → Run workflow)
# oder automatisch bei einem Versions-Tag (v1.2.3). Mit Tag – oder wenn beim Start von Hand eine Version
# eingetragen wird – entsteht zusätzlich ein Release mit den Installern.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release mit dieser Version anlegen oder ergänzen (z. B. 0.2). Leer lassen = nur Installer bauen."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS (Apple Silicon)", os: macos-latest, artifact: SetTracker-macOS-AppleSilicon.dmg }
          - { name: "Windows", os: windows-latest, artifact: SetTracker-Setup.exe }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install ".[build]"

      - name: App bündeln
        run: pyinstaller --noconfirm packaging/settracker.spec

      - name: Selbsttest der gebündelten App (macOS)
        if: runner.os == 'macOS'
        run: dist/SetTracker.app/Contents/MacOS/SetTracker --smoke-test

      - name: Selbsttest der gebündelten App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SETTRACKER_DATA = "$env:RUNNER_TEMP\settracker-data"
          $p = Start-Process -FilePath dist\SetTracker\SetTracker.exe -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:SETTRACKER_DATA\settracker.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Exit $($p.ExitCode))" }

      - name: DMG erstellen
        if: runner.os == 'macOS'
        run: |
          mkdir dmg
          cp -R dist/SetTracker.app dmg/
          ln -s /Applications dmg/Programme
          hdiutil create -volname SetTracker -srcfolder dmg -ov -format UDZO "dist/${{ matrix.artifact }}"

      - name: Setup.exe erstellen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installer
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # Gültig: 0.2, 0.2.1, v0.2, v0.2.0 – der Tag wird so verwendet, wie er eingegeben wurde.
          if ! printf '%s' "$TAG" | grep -Eq '^v?[0-9]+(\.[0-9]+){1,2}$'; then
            echo "Ungültige Version: $TAG (erwartet z. B. 0.2 oder v0.2.0)"; exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Release existiert schon: Installer anhängen bzw. ersetzen
            gh release upload "$TAG" installer/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" installer/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "SetTracker $TAG" --generate-notes
          fi
